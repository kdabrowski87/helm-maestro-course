# Default values for webapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

provision:
  jaeger: true

jaeger: 
  provisionDataStore:
    cassandra: false
  allInOne:
    enabled: true # for dev/test purposes!
  storage:
    type: memory
  agent:
    enabled: false
  collector:
    enabled: false
  query:
    enabled: false

replicaCount: 1

container:
  name: ""

image:
  repository: k8smaestro/shipy-webapp
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.1"

environment:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: OTEL_EXPORTER_JAEGER_AGENT_HOST
    value: "shipy-jaeger-agent.shipy.svc.cluster.local"
  - name: OTEL_EXPORTER_JAEGER_AGENT_PORT
    value: "6831"
  - name: OTEL_EXPORTER_JAEGER_ENDPOINT
    value: "http://shipy-jaeger-collector.shipy.svc.cluster.local:14268"
  - name: APIServiceLocations__CustomerManagementAPI
    value: "customermanagementapi.shipy.svc.cluster.local:5100"
  - name: APIServiceLocations__ShipManagementAPI
    value: "shipmanagementapi.shipy.svc.cluster.local:5000"
  - name: APIServiceLocations__WorkshopManagementAPI
    value: "workshopmanagementapi.shipy.svc.cluster.local:5200"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 7000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    memory: 64Mi
    cpu: 64m
  limits:
    memory: 128Mi
    cpu: 256m

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
